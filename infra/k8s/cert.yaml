apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: flashlights-certmanager
spec:
  secretName: flashlights-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  subject:
    organizations:
    - maintainer-summit
  commonName: flashlights
  isCA: false
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
  - digital signature
  - key encipherment
  dnsNames:
  - flashlights
  - flashlights.redis
  - flashlights.redis.svc
  - flashlights.redis.svc.cluster.local
  - flashlights-0
  - flashlights-0.redis
  - flashlights-0.redis.svc
  - flashlights-0.redis.svc.cluster.local
  - flashlights-1
  - flashlights-1.redis
  - flashlights-1.redis.svc
  - flashlights-1.redis.svc.cluster.local
  issuerRef:
    name: operators-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
