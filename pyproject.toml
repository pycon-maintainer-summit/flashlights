[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashlights-summit"
version = "2026.1"
description = "The PyCon US Maintainer Summit's app for its Flashlights instance"
requires-python = ">=3.14"
license = {text = "MIT"}
# The core image brings Django and everything else; the app adds nothing.
dependencies = []

[tool.setuptools]
packages = ["flashlights_summit"]

[tool.setuptools.package-data]
flashlights_summit = ["static/**/*", "templates/**/*"]

# The app's tests run inside the image, from the core's working directory,
# against the core's settings.
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "portal.settings"

# The core's lint settings (black, isort with the black profile, flake8 as
# the core's setup.cfg), so a file moves between the two without
# reformatting; the core's apps are first party here too.
[tool.black]
line-length = 88

[tool.isort]
profile = "black"
known_first_party = ["portal", "affiliations", "attendee", "common", "portal_account", "speakers", "sponsorship", "storage_backend", "ticketing", "volunteer", "webhooks", "flashlights_summit"]
