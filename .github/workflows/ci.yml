# Build the image from the pinned core, load the Maintainer Summit preset into a
# fresh database and run the app's tests, on every push and pull request,
# so a core upgrade that breaks the app fails here first; a second job lints
# the repository with the core's tools.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: docker compose build web
      - name: Migrate and load the preset
        run: |
          docker compose run --rm web python manage.py createcachetable
          docker compose run --rm web python manage.py migrate
          docker compose run --rm web python manage.py load_preset /community/presets/summit
      - name: Tests
        run: docker compose run --rm web sh -c 'pip install -q -r /community/requirements-test.txt && python -m pytest /community/tests -p no:cacheprovider'
      - if: always()
        run: docker compose down -v
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: make lint
